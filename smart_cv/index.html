<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de CV Universel Multi-Thèmes & OCR (SaaS)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta name="description"
      content="Générez, personnalisez et imprimez votre CV professionnel instantanément grâce à notre application SaaS multi-thèmes avec support OCR.">
</head>

<body>

    <div class="app-container">

        <!-- PANNEAU DE CONFIGURATION (GAUCHE) -->
        <div class="editor-panel no-print">
            <h2 id="ui-app-title">📝 Option de Configuration</h2>

            <div class="config-row">
                <div class="form-group">
                    <label id="ui-lbl-lang">Langue</label>
                    <select id="select-lang">
                        <option value="fr">Français 🇫🇷</option>
                        <option value="en">English 🇬🇧</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="ui-lbl-theme">Style / Couleur</label>
                    <select id="select-theme">
                        <option value="theme-navy">Midnight Navy (Gratuit)</option>
                        <option value="theme-emerald">Emerald Green (Gratuit)</option>
                        <option value="theme-ruby" data-premium="true">👑 Executive Ruby (Premium)
                        </option>
                        <option value="theme-gold" data-premium="true">👑 Luxury Gold (Premium)
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group ocr-box">
                <label style="color: #38bdf8; font-weight: bold;">🤖 Scanner un ancien CV
                    (Image)</label>
                <input type="file" id="input-ocr" accept="image/*" style="margin-top: 5px;">
                <div id="ocr-status" style="font-size: 11px; color: #94a3b8; margin-top: 6px;">En
                    attente d'un document...</div>
            </div>

            <div class="form-group">
                <label>Texte extrait par l'application :</label>
                <textarea id="ocr-result" rows="4"
                  placeholder="Le texte lu dans votre image s'écrira ici tout seul..."
                  style="background-color: #0f172a; color: #38bdf8; font-family: monospace; font-size: 11px; resize: vertical;"></textarea>
            </div>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">

            <div class="form-group">
                <label id="ui-lbl-photo">Photo de profil</label>
                <input type="file" id="input-photo" accept="image/*">
            </div>

            <div class="form-group">
                <label id="ui-lbl-nom">Nom complet</label>
                <input type="text" id="in-nom" value="BENJAMIN KIRONGOZI MAZUYA">
            </div>

            <div class="form-group">
                <label id="ui-lbl-titre">Titre du poste / Profil</label>
                <input type="text" id="in-titre"
                  value="LOGISTICS SPECIALIST & SOFTWARE SYSTEMS DEVELOPER">
            </div>

            <div class="form-group">
                <label id="ui-lbl-contacts">Contacts (Adresse, Tél)</label>
                <input type="text" id="in-contacts"
                  value="Kolwezi, Lualaba, RDC  |  +243 890 924 824">
            </div>

            <div class="form-group">
                <label id="ui-lbl-liens">Liens (Email, GitHub)</label>
                <input type="text" id="in-liens"
                  value="Email: monadresse@gmail.com  |  GitHub: github.com">
            </div>

            <div class="form-group">
                <label id="ui-lbl-profil">Accroche Professionnelle</label>
                <textarea id="in-profil"
                  rows="3">Expert chevronné en gestion logistique, maintenance et sécurité industrielle avec plus de 10 ans d'expérience dans les secteurs miniers et industriels.</textarea>
            </div>

            <h3 id="ui-sub-comp">🛠️ Compétences</h3>
            <div class="form-group">
                <label id="ui-lbl-comp1">Expertises Métier</label>
                <input type="text" id="in-comp1"
                  value="Gestion des stocks, HSE, Audits, Inventaires, Supervisions">
            </div>
            <div class="form-group">
                <label id="ui-lbl-comp2">Technologies & Outils</label>
                <input type="text" id="in-comp2"
                  value="Python, JavaScript, HTML5/CSS3, Git & GitHub">
            </div>

            <h3 id="ui-sub-exp">💼 Expérience</h3>
            <div class="form-group">
                <label id="ui-lbl-exp-titre">Poste Occupé</label>
                <input type="text" id="in-exp-titre"
                  value="Chief Storekeeper (Gestionnaire Principal des Stocks)">
            </div>
            <div class="form-group">
                <label id="ui-lbl-exp-cie">Entreprise & Ville</label>
                <input type="text" id="in-exp-cie" value="Complexe Industriel & Minier - Kolwezi">
            </div>
            <div class="form-group">
                <label id="ui-lbl-exp-dates">Dates</label>
                <input type="text" id="in-exp-dates" value="Nov 2019 - Présent">
            </div>
            <div class="form-group">
                <label id="ui-lbl-exp-details">Missions (Une par ligne)</label>
                <textarea id="in-exp-details"
                  rows="3">Diriger l'ensemble de la gestion des inventaires et des flux logistiques.&#10;Garantir l'application stricte des normes HSE et de sécurité industrielle.&#10;Optimiser les bases de données d'approvisionnement.</textarea>
            </div>

            <h3 id="ui-sub-edu">🎓 Éducation</h3>
            <div class="form-group">
                <label id="ui-lbl-edu-titre">Diplôme obtenu ou visé</label>
                <input type="text" id="in-edu-titre"
                  value="Bachelor of Science in Software Development">
            </div>
            <div class="form-group">
                <label id="ui-lbl-edu-dates">Années</label>
                <input type="text" id="in-edu-dates" value="2024 - 2027">
            </div>
            <div class="form-group">
                <label id="ui-lbl-edu-details">Établissement / Précisions</label>
                <input type="text" id="in-edu-details"
                  value="Focus Académique : Algorithmique, architectures logicielles et web.">
            </div>

            <!-- CONTENEUR DES BOUTONS D'ACTION CÔTE À CÔTE -->
            <div class="action-buttons-row">
                <button id="ui-btn-print" class="btn-print-action" onclick="window.print()">🖨️
                    Imprimer PDF</button>
                <button id="btn-pay-now" class="btn-premium-action"
                  onclick="declencherPaiement('illicocash', '+243973292227')">👑 Essai 3j puis
                    $1.99</button>
            </div>

            <!-- PETITS BOUTONS DE PAIEMENT MOBILE MONEY DIRECTS -->
            <div class="momo-container">
                <button class="btn-momo airtel"
                  onclick="declencherPaiement('Airtel Money', '+243973292227')">🔴 Airtel
                    Money</button>
                <button class="btn-momo orange"
                  onclick="declencherPaiement('Orange Money', '+243890924824')">🟠 Orange
                    Money</button>
            </div>
        </div>

        <!-- RENDER DU CV (DROITE) -->
        <div class="preview-panel">
            <div id="cv-target" class="cv-container theme-navy">

                <!-- FILIGRANE PAR DÉFAUT -->
                <div id="cv-watermark" class="watermark-premium">CV_Auto byu-tools.com</div>

                <header>
                    <div class="header-grid">
                        <div class="header-text">
                            <h1 id="cv-nom"></h1>
                            <div class="subtitle" id="cv-titre"></div>
                            <div class="contacts" id="cv-contacts"></div>
                            <div class="links" id="cv-liens"></div>
                        </div>
                        <div class="photo-container">
                            <img id="cv-photo" src="" alt="Profil" style="display:none;">
                            <div id="photo-placeholder" class="photo-blank"><span
                                  id="ui-cv-photo-lbl">PHOTO</span></div>
                        </div>
                    </div>
                </header>

                <main class="cv-content">
                    <section class="section">
                        <h2 class="section-title" id="cv-sec-profil">Profil Professionnel</h2>
                        <p id="cv-profil" class="text-block"></p>
                    </section>

                    <section class="section">
                        <h2 class="section-title" id="cv-sec-comp">Matrice des Compétences</h2>
                        <div class="comp-group text-block">
                            <strong id="cv-lbl-comp1">Expertises :</strong> <span
                              id="cv-comp1"></span>
                        </div>
                        <div class="comp-group text-block" style="margin-top: 8px;">
                            <strong id="cv-lbl-comp2">Technologies :</strong> <span
                              id="cv-comp2"></span>
                        </div>
                    </section>

                    <section class="section">
                        <h2 class="section-title" id="cv-sec-exp">Expérience Professionnelle</h2>
                        <div class="item">
                            <div class="item-header">
                                <span class="item-title" id="cv-exp-titre"></span>
                                <span class="item-date" id="cv-exp-dates"></span>
                            </div>
                            <div class="item-sub" id="cv-exp-cie"></div>
                            <ul class="item-details text-block" id="cv-exp-details"></ul>
                        </div>
                    </section>

                    <section class="section">
                        <h2 class="section-title" id="cv-sec-edu">Éducation & Formation</h2>
                        <div class="item">
                            <div class="item-header">
                                <span class="item-title" id="cv-edu-titre"></span>
                                <span class="item-date" id="cv-edu-dates"></span>
                            </div>
                            <div class="item-sub text-block" id="cv-edu-details"
                              style="font-style:normal; color:#334155; margin-top:4px;"></div>
                        </div>
                    </section>
                </main>
            </div>
        </div>

    </div>

    <div class="no-print"
      style="text-align: center; padding: 20px; color: #64748b; font-size: 12px; font-family: sans-serif;">
        © 2026 <strong>Benjamin K. Mazuya</strong>
    </div>

    <script src="app.js"></script>
</body>

</html>
