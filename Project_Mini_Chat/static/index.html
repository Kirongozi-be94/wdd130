<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Chat Local</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>💬 Chat Local</h2>

  <!-- 👥 USERS EN LIGNE -->
  <div id="users"></div>

  <!-- ✍️ TYPING -->
  <div id="typing"></div>

  <!-- 💬 CHAT -->
  <div id="chat"></div>

  <!-- 🧭 BARRE D'ENVOI -->
  <div class="bar">

    <input type="text" id="msg" placeholder="Votre message...">

    <button onclick="sendMsg()">
      Envoyer
    </button>

    <!-- 📎 IMAGE / FICHIER -->
    <input type="file" id="file" accept="image/*,audio/*" hidden>

    <button onclick="document.getElementById('file').click()">
      📷
    </button>

    <!-- 🎤 MICRO -->
    <button id="micBtn" onclick="toggleRecord()">
      🎤
    </button>

  </div>

  <!-- 🔌 JS -->
  <script src="app.js"></script>

</body>

</html>
