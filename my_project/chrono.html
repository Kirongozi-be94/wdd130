<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomètre & Rappels Métiers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <div style="text-align: left; margin-bottom: 20px;">
            <a href="index.html" style="text-decoration: none; font-weight: bold; color: var(--primary-color);">⬅️ Retour au Tableau de bord</a>
        </div>

        <h1>Chronomètre</h1>
        <div id="affichage">00:00:00:00</div> 
        
        <div class="boutons">
            <button id="btn-moins" class="btn btn-secondary">Reset</button>
            <button id="btn-plus" class="btn btn-primary">Démarrer</button>
        </div>

        <hr class="separateur">
        <section class="agenda-section">
            <h3>Rappel de Rendez-vous</h3>
            
            <form id="form-rdv">
                <input type="text" id="titre-rdv" placeholder="Objet de l'événement" required>
                <input type="datetime-local" id="date-rdv" required>
                <button type="submit" class="btn btn-submit">Ajouter à l'agenda</button>
            </form>
            
            <button type="button" id="btn-toggle-agenda" class="btn-toggle-view" style="width: 100%; margin-top: 10px;">Afficher mes rendez-vous 👁️</button>
            
            <div id="zone-liste-privee" class="d-none" style="margin-top: 15px;">
                <ul id="liste-rdv"></ul>
            </div>
        </section>
    </main>

    <script type="module" src="src/chrono.js"></script>
</body>
</html>
