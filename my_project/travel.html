<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congo Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <div class="langue-select">
            <button id="btn-fr" class="btn-lang">FR 🇫🇷</button>
            <button id="btn-en" class="btn-lang">EN 🇺🇸</button>
        </div>

        <div style="text-align: left; margin-bottom: 20px;">
            <a href="index.html" id="link-retour-hub-travel" style="text-decoration: none; font-weight: bold; color: var(--primary-color);">⬅️ Retour au Tableau de bord</a>
        </div>

        <section class="sensors-section">
            <h3 id="txt-titre-capteurs">🧭 Géolocalisation & Boussole</h3>
            <button type="button" id="btn-gps" class="btn btn-secondary" style="width: 100%; margin-bottom: 15px;">Activer mon GPS / GPRS 🛰️</button>
            
            <div id="affichage-gps" class="resultat-box d-none" style="background-color: #f1f8e9; border-left-color: #4caf50; margin-bottom: 15px;">
                <strong id="txt-pos-geodesique">Position Géodésique :</strong><br>
                Lat : <span id="gps-lat">0.0</span> | Lon : <span id="gps-lon">0.0</span><br>
                <span id="gps-ville-proche" style="font-style: italic; color: #555;"></span>
            </div>

            <div class="compass-container">
                <button type="button" id="btn-boussole" class="btn btn-secondary" style="width: 100%; margin-bottom: 15px;">Activer la Boussole 🧭</button>
                <div id="boussole-disque" class="compass-disc">
                    <div class="compass-arrow"></div>
                    <span class="direction nord">N</span><span class="direction est">E</span>
                    <span class="direction sud">S</span><span class="direction ouest">O</span>
                </div>
                <div id="boussole-degres" style="margin-top: 10px; font-weight: bold; color: #333;">0°</div>
            </div>
        </section>

        <hr class="separateur">
        <section class="travel-section">
            <h3 id="txt-titre-travel">🌍 Congo Travel Planner</h3>
            
            <div style="text-align: left;">
                <label id="lbl-choice-route" style="font-weight: bold; color: #555;">Type de calcul de routage :</label>
                <select id="travel-choice">
                    <option value="1" id="opt-choice-1">Calculer la distance entre deux villes</option>
                    <option value="2" id="opt-choice-2">Calculer le vecteur depuis Kinshasa</option>
                </select>
            </div>

            <div class="villes-inputs-container">
                <div style="flex: 1; text-align: left;">
                    <label id="lbl-depart" style="font-weight: bold; color: #555;">Ville Départ :</label>
                    <select id="city-start"></select>
                </div>
                <div style="flex: 1; text-align: left;">
                    <label id="lbl-arrivee" style="font-weight: bold; color: #555;">Ville Arrivée :</label>
                    <select id="city-end"></select>
                </div>
            </div>

            <div style="text-align: left; margin-top: 12px;">
                <label id="lbl-etat-route" style="font-weight: bold; color: #555;">État de la route :</label>
                <select id="road-condition-select">
                    <option value="good" id="opt-road-1">Bon (Asphalte / Stable)</option>
                    <option value="average" id="opt-road-2">Moyen (Piste praticable)</option>
                    <option value="bad" id="opt-road-3">Mauvais (Critique) ⚠️ Vecteur Air recommandé</option>
                </select>
            </div>

            <div style="text-align: left; margin-top: 12px;">
                <label id="lbl-transport" style="font-weight: bold; color: #555;">Vecteur de Transport :</label>
                <select id="transport-mode-select">
                    <option value="car" id="opt-trans-1">Véhicule (Car)</option>
                    <option value="plane" id="opt-trans-2">Aéronef (Plane)</option>
                    <option value="motorcycle" id="opt-trans-3">Moto (Motorcycle)</option>
                </select>
            </div>

            <button type="button" id="btn-calculer-voyage" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Calculer la cinématique 🚀</button>
            <div id="resultat-voyage" class="resultat-box d-none"></div>
        </section>
    </main>

    <script type="module" src="src/travel.js"></script>
</body>
</html>
