<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Sécurisé - Menu Principal</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <div id="horloge-temps-reel">Chargement du système...</div>

        <section id="zone-connexion" class="profil-user-form">
            <form id="form-login">
                <h3>Créer votre profil sécurisé</h3>
                
                <div class="avatar-upload-container">
                    <div class="avatar-preview-wrapper">
                        <img id="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>" alt="Aperçu">
                        <label for="input-avatar" class="upload-icon-label"><span>+</span></label>
                    </div>
                    <input type="file" id="input-avatar" accept="image/*" style="display: none;">
                    <button type="button" id="btn-choose-file" class="btn-secondary-sm">Choisir une photo</button>
                </div>

                <input type="text" id="login-nom" placeholder="Votre nom complet" required>
                <input type="email" id="login-email" placeholder="Votre adresse email" required>
                
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="display:block; margin-bottom:5px; color:#555; font-size:0.9rem; font-weight:bold;">Code PIN d'accès (Optionnel) :</label>
                    <input type="password" id="login-pin" placeholder="4 chiffres (Ex: 1234)" maxlength="4" pattern="[0-9]*" inputmode="numeric" style="text-align: center; font-size: 1.2rem; letter-spacing: 2px;">
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer et Déverrouiller</button>
            </form>
        </section>

        <div id="zone-profil-actif" class="profil-user-form d-none">
            <div class="profil-header-container">
                <img id="affichage-avatar" src="" alt="Avatar">
                <div class="profil-infos-textes">
                    <h2 id="affichage-nom">...</h2>
                    <div id="affichage-email">...</div>
                </div>
            </div>
            
            <hr class="separateur">
            
            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <a href="chrono.html" class="btn btn-primary" style="text-decoration: none; display: block;">⏱️ Module Chronomètre & Agenda</a>
                <a href="travel.html" class="btn btn-submit" style="text-decoration: none; display: block;">🌍 Module Congo Travel Planner</a>
            </div>

            <hr class="separateur">
            <button id="btn-deconnexion" class="btn-change-profil">Changer de profil 🔄</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 | Benjamin Kirongozi Mazuya | WDD 131</p>
    </footer>

    <script type="module" src="src/main.js"></script>
</body>
</html>
