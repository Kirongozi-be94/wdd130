<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Multi-Outils & Congo Planner</title>

    <!-- Feuille de style -->
    <link rel="stylesheet" href="style.css">

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Couleur du thème -->
    <meta name="theme-color" content="#ffffff">

    <!-- Icône -->
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- Description -->
    <meta name="description" content="Application Multi-Outils & Congo Planner pour la gestion du temps, des tâches et de l'agenda.">

    <!-- Compatibilité iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ChronoKirongozi">

    <!-- Icône iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <!-- Sélecteur de Langue -->
    <div class="langue-select">
        <button id="btn-fr" class="btn-lang active">FR</button>
        <button id="btn-en" class="btn-lang">EN</button>
    </div>

    <!-- Horloge Temps Réel -->
    <div id="horloge-temps-reel">📅 Chargement de la date...</div>

    <main class="card">
        
        <!-- ========================================== -->
        <!-- SYSTEME UTILISATEUR & CONNEXION            -->
        <!-- ========================================== -->
        <div id="zone-connexion" class="profil-user-form">
            <h3 id="txt-titre-login">Créer votre profil</h3>
            <form id="form-login">
                <div class="avatar-upload-container">
                    <div class="avatar-preview-wrapper">
                        <img id="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>" alt="Aperçu">
                        <label for="input-avatar" class="upload-icon-label">📷</label>
                    </div>
                    <input type="file" id="input-avatar" accept="image/*" style="display: none;">
                    <button type="button" id="btn-choose-file" class="btn-secondary-sm">Choisir une image</button>
                </div>
                <input type="text" id="login-nom" required placeholder="Votre nom complet">
                <input type="email" id="login-email" required placeholder="Votre adresse email">
                <input type="password" id="login-pin" maxlength="4" placeholder="Code PIN secret (4 chiffres - optionnel)">
                <button type="submit" id="btn-login" class="btn btn-primary">Accéder à l'application</button>
            </form>
        </div>

        <div id="zone-profil-actif" class="d-none">
            <div class="profil-header-container">
                <img id="affichage-avatar" src="" alt="Avatar">
                <div class="profil-infos-textes">
                    <p id="affichage-nom" class="nom-complet"></p>
                    <p id="affichage-email" class="email-user"></p>
                    <button id="btn-deconnexion" class="btn-change-profil">Changer de profil 🔄</button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- CONTENU DE L'APPLICATION ACCESSIBLE       -->
        <!-- ========================================== -->
        <div id="contenu-application" class="d-none">

            <!-- SECTION AGENDA -->
            <section class="agenda-section">
                <h3 id="txt-titre-agenda">Rappel de Rendez-vous</h3>
                <form id="form-rdv">
                    <input type="text" id="titre-rdv" required placeholder="Objet du rendez-vous">
                    <input type="datetime-local" id="date-rdv" required>
                    <button type="submit" id="btn-valider-agenda" class="btn btn-submit">Ajouter à l'agenda</button>
                </form>

                <button id="btn-toggle-agenda" class="btn-toggle-view">Afficher mes rendez-vous 👁️</button>
                
                <div id="zone-liste-privee" class="d-none">
                    <ul id="liste-rdv"></ul>
                </div>
            </section>

            <hr class="separateur">

            <!-- SECTION CONGO TRAVEL PLANNER -->
            <section class="travel-section">
                <h3>🇨🇩 Congo Travel Planner</h3>
                <div class="form-group-travel">
                    <label for="travel-choice">Option de départ :</label>
                    <select id="travel-choice">
                        <option value="1">Entre 2 villes quelconques</option>
                        <option value="2">Depuis Kinshasa uniquement</option>
                    </select>
                </div>

                <div class="form-group-travel">
                    <label for="city-start">Ville de départ :</label>
                    <select id="city-start"></select>
                </div>

                <div class="form-group-travel" id="zone-city-end">
                    <label for="city-end">Ville de destination :</label>
                    <select id="city-end"></select>
                </div>

                <div class="form-group-travel">
                    <label for="road-condition-select">État de la route :</label>
                    <select id="road-condition-select">
                        <option value="good">Bon état</option>
                        <option value="average" selected>État moyen</option>
                        <option value="bad">Mauvais état</option>
                    </select>
                </div>

                <div class="form-group-travel">
                    <label for="transport-mode-select">Mode de transport :</label>
                    <select id="transport-mode-select">
                        <option value="car" selected>Voiture</option>
                        <option value="plane">Avion</option>
                        <option value="motorcycle">Moto</option>
                        <option value="bike">Vélo</option>
                        <option value="walking">Marche à pied</option>
                    </select>
                </div>

                <button id="btn-calculer-voyage" class="btn btn-primary" style="width: 100%;">Calculer l'itinéraire</button>
                <div id="resultat-voyage" class="d-none" style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; text-align: left; font-size: 0.9rem; line-height: 1.5;"></div>
            </section>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Outils Connectés & Congo Planner</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
