<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomètre & Agenda - WDD 131</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <div class="langue-select">
            <button id="btn-fr" class="btn-lang active">FR 🇫🇷</button>
            <button id="btn-en" class="btn-lang">EN 🇺🇸</button>
        </div>

        <section id="zone-connexion" class="profil-user-form">
            <form id="form-login">
                <h3 id="txt-titre-login">Créer votre profil sécurisé</h3>
                
                <div class="avatar-upload-container">
                    <div class="avatar-preview-wrapper">
                        <img id="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>" alt="Aperçu">
                        <label for="input-avatar" class="upload-icon-label">
                            <span style="font-size: 16px; color: white; font-weight: bold;">+</span>
                        </label>
<div style="margin-bottom: 15px;">
    <label style="display:block; margin-bottom:5px; color:#555; font-size:0.9rem; font-weight:bold;">Créer un Code PIN Secret (Optionnel - 4 chiffres) :</label>
    <input type="password" id="login-pin" placeholder="Laisser vide si pas de code" maxlength="4" pattern="[0-9]*" inputmode="numeric" style="text-align: center; font-size: 1.3rem; letter-spacing: 2px;">
</div>

                <input type="text" id="login-nom" placeholder="Votre nom complet" required>
                <input type="email" id="login-email" placeholder="Votre adresse email" required>
                
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; color:#555; font-size:0.9rem; font-weight:bold;">Créer votre Code PIN Secret (4 chiffres) :</label>
                    <input type="password" id="login-pin" placeholder="Ex: 2026" maxlength="4" pattern="[0-9]*" inputmode="numeric" style="text-align: center; font-size: 1.3rem; letter-spacing: 5px;" required>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary">Enregistrer et Déverrouiller</button>
            </form>
        </section>

        <div id="zone-profil-actif" class="d-none" style="text-align: center; margin-bottom: 15px;">
            <img id="affichage-avatar" src="" alt="Avatar" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 5px;">
            <h2 id="affichage-nom" style="margin: 5px 0; font-size: 1.2rem;"></h2>
            <div id="affichage-email" style="font-size: 0.9rem; color: #666; margin-bottom: 10px;"></div>
            <button id="btn-deconnexion" class="btn-secondary-sm">Changer de profil 🔄</button>
        </div>

        <div id="contenu-application" class="d-none">
            <hr class="separateur">
            
            <div id="horloge-temps-reel">Chargement...</div>

            <h1 id="txt-titre-chrono">Chronomètre</h1>
            <div id="affichage">00:00:00:00</div> 
            
            <div class="boutons">
                <button id="btn-moins" class="btn btn-secondary">Reset</button>
                <button id="btn-plus" class="btn btn-primary">Démarrer</button>
            </div>

            <section class="agenda-section">
                <h3 id="txt-titre-agenda">Rappel de Rendez-vous</h3>
                
                <form id="form-rdv">
                    <input type="text" id="titre-rdv" placeholder="Objet du rendez-vous" required>
                    <input type="datetime-local" id="date-rdv" required>
                    <button type="submit" id="btn-valider-agenda" class="btn btn-submit">Ajouter à l'agenda</button>
                </form>
                
                <button type="button" id="btn-toggle-agenda" class="btn-toggle-view">Afficher mes rendez-vous 👁️</button>
                
                <div id="zone-liste-privee" class="d-none">
                    <ul id="liste-rdv"></ul>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 | Benjamin Kirongozi Mazuya | WDD 131</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
