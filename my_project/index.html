<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chrono & Agenda Kirongozi</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#007bff">
</head>
<body>

    <div class="container">

        <h1>Chrono & Agenda Kirongozi</h1>

        <!-- FORMULAIRE CONNEXION -->
        <div id="zone-connexion">

            <h2>Créer votre profil</h2>

            <form id="form-login">

                <div class="avatar-zone">

                    <img
                        id="avatar-preview"
                        src="icon-192.png"
                        alt="Avatar">

                    <input
                        type="file"
                        id="input-avatar"
                        accept="image/*"
                        hidden>

                    <button
                        type="button"
                        id="btn-choose-file">
                        Choisir une photo
                    </button>

                </div>

                <input
                    type="text"
                    id="login-nom"
                    placeholder="Nom complet"
                    required>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Adresse email"
                    required>

                <input
                    type="password"
                    id="login-pin"
                    maxlength="4"
                    placeholder="PIN (optionnel)">

                <button type="submit">
                    Enregistrer
                </button>

            </form>

        </div>

        <!-- PROFIL -->
        <div id="zone-profil-actif" class="d-none">

            <img
                id="affichage-avatar"
                src="icon-192.png"
                alt="Avatar">

            <h3 id="affichage-nom"></h3>

            <p id="affichage-email"></p>

        </div>

        <!-- APPLICATION -->
        <div id="contenu-application" class="d-none">

            <h2>Bienvenue dans votre agenda</h2>

            <p>
                Votre profil est correctement enregistré.
            </p>

        </div>

    </div>

    <script src="script.js" defer></script>

</body>
</html>
