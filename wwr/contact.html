<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting Company</title>

    <meta name="description"
      content="Contact White Water Rafting Company for reservations, rafting questions, trip information, and customer support.">

    <meta name="author" content="Benjamin Kirongozi Mazuya">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO -->
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>(+243) 97 32 922 27</p>
            <p>kirongozinotes1@gmail.com</p>
        </section>

        <!-- MAP + FORM -->
        <section class="contact-grid">

            <!-- MAP -->
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18..." loading="lazy"
                  allowfullscreen>
                </iframe>
            </div>

            <!-- FORM -->
            <div class="contact-form">

                <form>

                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder">
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder">
                    </div>

                    <div class="form-row purpose-row">
                        <p>Message Purpose</p>

                        <div class="radio-options">

                            <input type="radio" id="general" name="purpose" value="general">
                            <label for="general">General Inquiry</label>

                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>

                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>

                        </div>
                    </div>

                    <div class="form-row">
                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="5"
                          placeholder="Type here"></textarea>
                    </div>

                    <label class="newsletter" for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>

        <!-- EMPLOYEES -->
        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile">
                    <figcaption>River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/profile.png" alt="Employee Profile">
                    <figcaption>Reservation Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile">
                    <figcaption>Trip Coordinator</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>©2026 💦 White Water Rafting 💦 Benjamin Kirongozi Mazuya</p>

        <nav class="socialmedia">
            <a href="https://web.facebook.com/benjamin.kirongozi.mazuya/directory_links">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://www.linkedin.com/in/benjamin-kirongozi-mazuya-806a2926a/">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>

            <a href="https://vm.tiktok.com/ZS9FnAnqUc163-WUEvp/">
                <img src="images/tiktok.png" alt="TikTok">
            </a>
        </nav>
    </footer>

</body>

</html>
